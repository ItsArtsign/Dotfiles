[notification]
offset_x = 10
offset_y = 10

[osd]
offset_x = 10
offset_y = 10

[shell]
corner_radius_scale = 0

    [shell.animation]
    speed = 1.5000000223517418

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "top_right"
    floating_offset = 10
    wallpaper_placement = "floating"
    wallpaper_position = "center"

[system.monitor]
cpu_temp_activity_threshold = 75
cpu_temp_critical_threshold = 100

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Mocha Blue"
mode = "dark"
source = "community"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kcolorscheme", "qt" ]

[wallpaper]
directory = "__HOME__/Pictures/Wallpapers"

    [wallpaper.default]
    path = "__HOME__/Pictures/Wallpapers/mocha-pixel-galaxy.png"

    [wallpaper.last]
    path = "__HOME__/Pictures/Wallpapers/mocha-pixel-galaxy.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "__HOME__/Pictures/saturn-rings.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "__HOME__/Pictures/Wallpapers/mocha-pixel-galaxy.png"

[widget.clock]
format = "{:%H:%M - %d/%m}"

[widget.media]
album_art_only = true

[widget.sysmon_2]
enabled = false

[widget.sysmon_3]
enabled = false

[widget.temp]
enabled = false

[widget.tray]
capsule = false
color = "surface"

[widget.volume]
enabled = false

[widget.workspaces]
capsule = false