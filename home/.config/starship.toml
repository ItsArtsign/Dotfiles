# Starship — sharp Catppuccin Mocha (square blocks, no powerline caps)
# Managed via ~/.agents (see LOG.md)
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "catppuccin_mocha"

# Line 1: [ dir ][ git ] lang versions ......... duration
# Line 2: ❯
format = """
$directory$git_branch$git_state$git_status$java$gradle$kotlin$nodejs$python$rust$golang\
$fill$cmd_duration$status
$character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"

[directory]
style             = "bold fg:crust bg:mauve"
read_only_style   = "fg:crust bg:mauve"
read_only         = " 󰌾"
format            = "[ $path$read_only ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol       = "~"
truncate_to_repo  = false

[git_branch]
symbol = " "
style  = "fg:text bg:surface0"
format = "[ $symbol$branch ]($style)"

[git_state]
style  = "fg:peach bg:surface0"
format = "[$state( $progress_current/$progress_total) ]($style)"

[git_status]
style      = "fg:yellow bg:surface0"
format     = "([$all_status$ahead_behind ]($style))"
conflicted = "="
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "≡"
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

# Language versions: plain colored text, only shown inside matching projects
[java]
symbol = " "
style  = "fg:peach"
format = " [$symbol$version]($style)"

[gradle]
symbol = " "
style  = "fg:teal"
format = " [$symbol$version]($style)"

[kotlin]
symbol = " "
style  = "fg:mauve"
format = " [$symbol$version]($style)"

[nodejs]
symbol = " "
style  = "fg:green"
format = " [$symbol$version]($style)"

[python]
symbol = " "
style  = "fg:yellow"
format = " [$symbol$version( \\($virtualenv\\))]($style)"

[rust]
symbol = " "
style  = "fg:peach"
format = " [$symbol$version]($style)"

[golang]
symbol = " "
style  = "fg:sapphire"
format = " [$symbol$version]($style)"

[cmd_duration]
min_time = 2000
style    = "fg:overlay1"
format   = "[ $duration]($style) "

[status]
disabled = false
symbol   = "✘ "
style    = "fg:red"
format   = "[$symbol$status]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
