# kitty — sharp Catppuccin Mocha
# Managed via ~/.agents (see LOG.md). Reload: ctrl+shift+f5 (or `pkill -USR1 kitty`)

# ---------- theme ----------
include themes/catppuccin-mocha.conf

# ---------- font ----------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures cursor

# ---------- window ----------
background_opacity     0.9
window_padding_width   14
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size   no
window_border_width    1pt
draw_minimal_borders   yes
inactive_text_alpha    0.85

# ---------- cursor ----------
cursor_shape           block
cursor_blink_interval  0
cursor_trail           1

# ---------- tabs: flat square blocks ----------
tab_bar_edge           top
tab_bar_style          separator
tab_separator          ""
tab_bar_margin_width   0
tab_bar_margin_height  0 10
tab_title_template     " {index} {title[:30]} "
active_tab_font_style  bold
inactive_tab_font_style normal
tab_bar_min_tabs       2

# ---------- behaviour ----------
scrollback_lines       10000
copy_on_select         clipboard
strip_trailing_spaces  smart
enable_audio_bell      no
visual_bell_duration   0
url_style              straight
detect_urls            yes
sync_to_monitor        yes
