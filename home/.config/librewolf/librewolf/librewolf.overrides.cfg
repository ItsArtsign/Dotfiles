// LibreWolf overrides — managed via ~/.agents (see LOG.md)
// Loaded by /usr/lib/librewolf/librewolf.cfg on startup. Restart LibreWolf to apply.

// Figma & Photopea break under resistFingerprinting (canvas readback is
// randomized/blocked, WebGL info spoofed). Exempt only these sites; RFP stays
// on everywhere else.
defaultPref("privacy.resistFingerprinting.exemptedDomains",
  "figma.com,*.figma.com,photopea.com,*.photopea.com");

// WebGL is already enabled in this LibreWolf build; set explicitly for clarity.
defaultPref("webgl.disabled", false);

// Don't auto-pop videos into Picture-in-Picture when switching tabs.
// pref() (not defaultPref) because the profile had this set to true as a user pref.
// Manual PiP (the button on videos) still works.
pref("media.videocontrols.picture-in-picture.enable-when-switching-tabs.enabled", false);
